services:
  - type: web
    name: hoc-vien-thien-tinh
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoc-vien-thien-tinh-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: hoc-vien-thien-tinh-db
